[package]
name = "gmad-social-planner"
version = "0.1.0"
description = "Planejamento editorial local da GMAD Rio Preto"
edition = "2021"

[lib]
name = "gmad_social_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
