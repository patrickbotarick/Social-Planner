[package]
name = "gmad-social-planner"
version = "0.1.0"
description = "Planejamento editorial local da GMAD Rio Preto"
edition = "2021"

[lib]
name = "gmad_social_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tauri-plugin-dialog = "=2.8.2"
uuid = { version = "=1.28.0", features = ["v4"] }
sha2 = "=0.10.9"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
mp4 = "=0.14.0"
unicode-normalization = "=0.1.24"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
url = "2"
keyring = { version = "=3.6.3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
